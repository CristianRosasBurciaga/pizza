<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza</title>
    
    <!-- Favicon-->
    <link rel="icon" href="images/pizza-icon.jpg">
    <link rel="stylesheet" href="styles/pizza-styles.css">
</head>
<body>
    <div id="main">
        <div id="header">
            <h1>Welcome to Pizza</h1>
            <h2>Serving GRC students for 50 years!</h2>
            <img src="images/pizza-header.jpg" alt="pizza holding a pizza box">

            <p>We make the best pizza ever. Visit us today.</p>
            <a id="contact-button" href="#" role="button">Contact us</a>
        </div>
        
        <form id="pizza-form" action="#" method="get">

            <!-- Contact Info -->
             <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
             </fieldset>

             <!-- Pickup or Delivery -->
             <fieldset>
                <legend>Select Pickup or Delivery</legend>
                <label for="pickup">
                    <input type="radio" id="pickup" name="method" value="pickup">
                </label>
                <label for="delivery">
                    <input type="radio" id="delivery" name="method" value="delivery">
                </label>
             </fieldset>

             <!-- Order button -->
             <button type="submit" id="order-button">Place Order</button>
        </form>

    </div>
    

</body>
</html>
