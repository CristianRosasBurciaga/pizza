<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza</title>
    
    <!-- Favicon-->
    <link rel="icon" href="images/pizza-icon.jpg">
    <link rel="stylesheet" href="styles/pizza-styles.css">
    <script src="scripts/pizza.js" defer></script>
</head>
<body>
    <div id="main">
        <div id="header">
            <img src="images/pizza-header.jpg" alt="pizza holding a pizza box">
            <h1>Hi, Welcome to Pizza</h1>
            <h2>Serving GRC students for 50 years!</h2>

            <p>We make the best pizza ever. Visit us today.</p>
            <a id="contact-button" href="/contact" role="button">Contact us</a>
        </div>
        
        <form id="pizza-form" action="/submit-order" method="post">

            <!-- Contact Info -->
             <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname">
                <span class="err" id="err-fname">First name is required</span>

                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname">
                <span class="err" id="err-lname">Last name is required</span>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
             </fieldset>

             <!-- Pickup or Delivery -->
             <fieldset>
                <legend>Select Pickup or Delivery</legend>
                <span class="err" id="err-method">Select Pickup or Delivery</span>
                <label for="pickup">
                    <input type="radio" id="pickup" name="method" value="pickup">
                </label>
                <label for="delivery">
                    <input type="radio" id="delivery" name="method" value="delivery">
                </label>
             </fieldset>

             <!-- Select toppings -->
             <fieldset id="topping">
                <legend>Select Topping</legend>
                <label for="pepperoni">
                    <input type="checkbox" id="pepperoni" name="toppings[]" value="pepperoni">
                    Pepperoni
                </label>
                <label for="ham">
                    <input type="checkbox" id="ham" name="toppings[]" value="ham">
                Ham
                </label>
                <label for="sausage">
                    <input type="checkbox" id="sausage" name="toppings[]" value="sausage">
                    Sausage
                </label>
                <label for="chicken">
                    <input type="checkbox" id="chicken" name="toppings[]" value="chicken">
                    Chicken
                </label>
                <label for="pineapple">
                    <input type="checkbox" id="pineapple" name="toppings[]" value="pineapple">
                    Pineapple
                </label>
                <label for="mushroom">
                    <input type="checkbox" id="mushroom" name="toppings[]" value="mushroom">
                    Mushroom
                </label>
                <label for="spinach">
                    <input type="checkbox" id="spinach" name="toppings[]" value="spinach">
                    Spinach
                </label>
             </fieldset>

             <!--Select pizza size -->
             <fieldset>
                <legend>Select Pizza Size</legend>
                <span class="err" id="err-size">Select a size</span>
                <select id="size" name="size">
                    <option value="none">-- Select a Size --</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
             </fieldset>

             <!-- Comment field -->
              <label for="comment">Comments</label>
              <textarea rows="5" name="comment" id="comment"></textarea>

             <!-- Order button -->
             <button type="submit" id="order-button">Place Order</button>
        </form>
    </div>
    

</body>
</html>
